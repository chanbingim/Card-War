<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Unity Firebase Login</title>

    <style>

        body {
            margin: 20px;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-bottom: 15px;
        }

        #result {
            white-space: pre-wrap;
            word-break: break-all;
            background: #222;
            padding: 20px;
            border-radius: 8px;
            min-height: 400px;
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
        }
    </style>

</head>


<body>

    <h2>Unity Firebase Login</h2>

    <pre id="result">Starting...</pre>


    <script type="module">


        // ============================================================
        // Firebase Import
        // ============================================================

        import
        {
        initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import
        {
        getAuth,
        GoogleAuthProvider,
        signInWithRedirect,
        getRedirectResult,
        signOut
        }
        from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        // ============================================================
        // Log
        // ============================================================

        const resultElement =
        document.getElementById("result");


        function Log(message)
        {
        resultElement.textContent +=
        message + "\n";

        console.log(message);
        }


        function ClearLog()
        {
        resultElement.textContent = "";
        }


        // ============================================================
        // Firebase Config
        // ============================================================

        const firebaseConfig =
        {
        apiKey:
        "AIzaSyCvbIOnMsVcxpOAkh-g9--larhOWgdVagw",

        authDomain:
        "card-war-c7cd9.firebaseapp.com",

        projectId:
        "card-war-c7cd9",

        storageBucket:
        "card-war-c7cd9.firebasestorage.app",

        messagingSenderId:
        "248919833820",

        appId:
        "1:248919833820:web:f93d6a779632c9bcea4819",

        measurementId:
        "G-08FX75GWVY"
        };


        // ============================================================
        // Firebase Initialize
        // ============================================================

        Log("================================");
        Log("Firebase Initialize");
        Log("================================");
        Log("");


        const app =
        initializeApp(firebaseConfig);


        const auth =
        getAuth(app);


        // ============================================================
        // Google Provider
        // ============================================================

        const provider =
        new GoogleAuthProvider();


        // 구글 계정 선택창 강제
        provider.setCustomParameters({
        prompt: "select_account"
        });


        Log(
        "Google Provider : OK"
        );


        Log(
        "Google Account Selection : ENABLED"
        );


        Log("");


        // ============================================================
        // Firebase 정보
        // ============================================================

        Log(
        "Auth : " +
        (
        auth
        ? "OK"
        : "NULL"
        )
        );


        Log(
        "Auth Domain : " +
        auth.config.authDomain
        );


        Log(
        "Current Origin : " +
        window.location.origin
        );


        Log(
        "Current URL : " +
        window.location.href
        );


        Log("");


        // ============================================================
        // Login Guard
        // ============================================================
        // Main()의 로그인 처리(성공 콜백 / StartGoogleLogin)가
        // 두 번 이상 실행되는 것을 막기 위한 플래그.
        // onAuthStateChanged 리스너는 로그아웃->재로그인 시마다
        // 별도로 상태변경을 감지해서 Main()의 흐름과 겹치며
        // 반복 트리거를 일으킬 수 있으므로 사용하지 않음.

        let hasHandled = false;


        // ============================================================
        // Unity Callback
        // ============================================================

        function SendUnityCallback(
        success,
        token = "",
        error = ""
        )
        {
        Log("");
        Log("================================");
        Log("Unity Callback");
        Log("================================");


        let callbackUrl =
        "http://127.0.0.1:5000/callback" +
        "?success=" +
        success;


        // --------------------------------------------------------
        // Success
        // --------------------------------------------------------

        if (
        success &&
        token !== ""
        )
        {
        callbackUrl +=
        "&token=" +
        encodeURIComponent(token);
        }


        // --------------------------------------------------------
        // Error
        // --------------------------------------------------------

        if (
        !success &&
        error !== ""
        )
        {
        callbackUrl +=
        "&error=" +
        encodeURIComponent(error);
        }


        Log(
        "Callback URL:"
        );


        Log(
        callbackUrl
        );


        Log("");


        // --------------------------------------------------------
        // Unity로 이동
        // --------------------------------------------------------

        window.location.href =
        callbackUrl;
        }


        // ============================================================
        // Logout
        // ============================================================

        async function Logout()
        {
        try
        {
        Log("");
        Log("================================");
        Log("Firebase Logout");
        Log("================================");
        Log("");


        // Firebase 로그아웃
        await signOut(auth);


        Log(
        "Firebase Logout Success"
        );


        Log(
        "Current User : " +
        (
        auth.currentUser
        ? auth.currentUser.uid
        : "NULL"
        )
        );


        Log("");


        return true;
        }
        catch(error)
        {
        Log(
        "Firebase Logout Error"
        );


        Log(
        "Code : " +
        (
        error.code ||
        "UNKNOWN"
        )
        );


        Log(
        "Message : " +
        error.message
        );


        return false;
        }
        }


        // ============================================================
        // Logout 후 다시 Google Login
        // ============================================================

        async function LogoutAndLogin()
        {
        const logoutSuccess =
        await Logout();


        if (!logoutSuccess)
        {
        return false;
        }


        Log(
        "Starting Google Login Again..."
        );


        await StartGoogleLogin();


        return true;
        }


        // ============================================================
        // Start Google Login
        // ============================================================

        async function StartGoogleLogin()
        {
        try
        {
        Log("");
        Log("================================");
        Log("Start Google Login");
        Log("================================");
        Log("");


        Log(
        "Auth Domain : " +
        auth.config.authDomain
        );


        Log(
        "Current Origin : " +
        window.location.origin
        );


        Log("");


        Log(
        "Google Account Selection : ENABLED"
        );


        Log(
        "Calling signInWithRedirect()..."
        );


        // 구글 로그인
        await signInWithRedirect(
        auth,
        provider
        );
        }
        catch(error)
        {
        Log("");
        Log("================================");
        Log("Google Login Error");
        Log("================================");


        Log(
        "Code : " +
        (
        error.code ||
        "UNKNOWN"
        )
        );


        Log(
        "Message : " +
        error.message
        );


        SendUnityCallback(
        false,
        "",
        error.message
        );
        }
        }


        // ============================================================
        // Main
        // ============================================================

        async function Main()
        {
        // 이미 처리(성공/재로그인 시도)된 적이 있으면
        // 다시 실행하지 않음 (반복 방지)
        if (hasHandled)
        {
        Log("Main() : 이미 처리됨, 재실행 스킵");
        return;
        }

        try
        {
        ClearLog();

        Log("================================");
        Log("Firebase Login Start");
        Log("================================");
        Log("");

        Log("[URL]");
        Log(window.location.href);
        Log("");

        Log("[Origin]");
        Log(window.location.origin);
        Log("");

        // ----------------------------------------------------------
        // 1. Redirect 결과 확인
        // ----------------------------------------------------------

        Log("[1] getRedirectResult() 호출");

        const redirectResult =
        await getRedirectResult(auth);

        Log("[2] getRedirectResult() 완료");
        Log("");

        // ----------------------------------------------------------
        // 2. Google 로그인 후 돌아온 경우 (성공)
        // ----------------------------------------------------------

        if (
        redirectResult &&
        redirectResult.user
        )
        {
        Log("================================");
        Log("REDIRECT LOGIN SUCCESS");
        Log("================================");
        Log("");

        const user =
        redirectResult.user;

        Log(
        "UID : " +
        user.uid
        );

        Log(
        "Email : " +
        user.email
        );

        Log("");

        const idToken =
        await user.getIdToken(true);

        Log(
        "ID Token Length : " +
        idToken.length
        );

        Log("");

        hasHandled = true;

        SendUnityCallback(
        true,
        idToken
        );

        // 성공 처리 후 반드시 종료 (아래 로그아웃/재로그인 로직 실행 방지)
        return;
        }

        // ----------------------------------------------------------
        // 3. 기존 Firebase 로그인 상태 확인 (redirect 결과가 없을 때만 도달)
        // ----------------------------------------------------------

        Log("[3] Current User 확인");

        if (auth.currentUser)
        {
        Log(
        "기존 Firebase User 발견"
        );

        Log(
        "UID : " +
        auth.currentUser.uid
        );

        Log("");

        // 기존 Firebase 로그인 제거
        Log(
        "기존 Firebase 로그인 로그아웃..."
        );

        await signOut(auth);

        Log(
        "Firebase Logout 완료"
        );

        Log(
        "Current User : " +
        (
        auth.currentUser
        ? auth.currentUser.uid
        : "NULL"
        )
        );

        Log("");
        }
        else
        {
        Log(
        "기존 Firebase User 없음"
        );

        Log("");
        }

        // ----------------------------------------------------------
        // 4. Google 로그인 시작
        // ----------------------------------------------------------

        Log("================================");
        Log("Google Login 시작");
        Log("================================");
        Log("");

        await StartGoogleLogin();
        }
        catch(error)
        {
        Log("");
        Log("================================");
        Log("MAIN ERROR");
        Log("================================");
        Log("");

        Log(
        "Code : " +
        (
        error.code ||
        "UNKNOWN"
        )
        );

        Log(
        "Message : " +
        error.message
        );

        hasHandled = true;

        SendUnityCallback(
        false,
        "",
        error.message
        );

        console.error(error);
        }
        }


        // ============================================================
        // Start
        // ============================================================

        Main();


    </script>

</body>

</html>
