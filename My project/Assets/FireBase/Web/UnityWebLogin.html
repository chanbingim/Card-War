<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Unity Firebase Login</title>
</head>

<body>

    <p id="result">Google 로그인 준비 중...</p>

    <script type="module">

        // ============================================================
        // Firebase Import
        // ============================================================

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithRedirect,
            getRedirectResult
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


        // ============================================================
        // Firebase Config
        // ============================================================

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCvbIOnMsVcxpOAkh-g9--larhOWgdVagw",
  authDomain: "card-war-c7cd9.firebaseapp.com",
  projectId: "card-war-c7cd9",
  storageBucket: "card-war-c7cd9.firebasestorage.app",
  messagingSenderId: "248919833820",
  appId: "1:248919833820:web:f93d6a779632c9bcea4819",
  measurementId: "G-08FX75GWVY"
};


        // ============================================================
        // Firebase 초기화
        // ============================================================

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const provider =
            new GoogleAuthProvider();


        console.log("Firebase Auth:", auth);
        console.log(
            "Firebase Auth Domain:",
            auth.config.authDomain
        );


        // ============================================================
        // Unity Callback
        // ============================================================

        function SendUnityCallback(
            success,
            token = "",
            error = ""
        )
        {
            let callbackUrl =
                "http://127.0.0.1:5000/callback" +
                "?success=" +
                success;


            // 로그인 성공
            if (success && token !== "")
            {
                callbackUrl +=
                    "&token=" +
                    encodeURIComponent(token);
            }


            // 로그인 실패
            if (!success && error !== "")
            {
                callbackUrl +=
                    "&error=" +
                    encodeURIComponent(error);
            }


            console.log(
                "Unity Callback:",
                callbackUrl
            );


            window.location.href =
                callbackUrl;
        }


        // ============================================================
        // Firebase Redirect 결과 확인
        // ============================================================

        async function CheckLoginResult()
        {
            try
            {
                const result =
                    await getRedirectResult(auth);


                // ----------------------------------------------------
                // Redirect 결과 없음
                // ----------------------------------------------------

                if (result == null)
                {
                    SendUnityCallback(
                        false,
                        "",
                        "Firebase Redirect 결과를 받지 못했습니다."
                    );

                    return false;
                }


                // ----------------------------------------------------
                // 로그인 성공
                // ----------------------------------------------------

                const user =
                    result.user;


                console.log(
                    "Firebase Login Success"
                );

                console.log(
                    "UID:",
                    user.uid
                );

                console.log(
                    "Email:",
                    user.email
                );


                // ----------------------------------------------------
                // Firebase ID Token
                // ----------------------------------------------------

                const idToken =
                    await user.getIdToken();


                // ----------------------------------------------------
                // Unity Callback
                // ----------------------------------------------------

                SendUnityCallback(
                    true,
                    idToken
                );


                return true;
            }
            catch(error)
            {
                console.error(
                    "Firebase Redirect Error:",
                    error
                );


                SendUnityCallback(
                    false,
                    "",
                    error.message
                );


                return false;
            }
        }


        // ============================================================
        // Google 로그인 시작
        // ============================================================

        async function StartGoogleLogin()
        {
            try
            {
                document
                    .getElementById("result")
                    .textContent =
                    "Google 로그인 페이지로 이동합니다...";


                // ----------------------------------------------------
                // Redirect 시작 표시
                //
                // Google 로그인 후 이 페이지로 돌아오면
                // 이 값을 이용해서 Redirect 복귀인지 판단한다.
                // ----------------------------------------------------

                sessionStorage.setItem(
                    "firebase_redirect_login",
                    "true"
                );


                await signInWithRedirect(
                    auth,
                    provider
                );
            }
            catch(error)
            {
                console.error(
                    "Google Login Error:",
                    error
                );


                sessionStorage.removeItem(
                    "firebase_redirect_login"
                );


                SendUnityCallback(
                    false,
                    "",
                    error.message
                );
            }
        }


        // ============================================================
        // Main
        // ============================================================

        async function Main()
        {
            const redirectLogin =
                sessionStorage.getItem(
                    "firebase_redirect_login"
                );


            // ========================================================
            // CASE 1
            // Google 로그인 후 돌아온 경우
            // ========================================================

            if (redirectLogin === "true")
            {
                // 한 번 처리했으면 제거
                sessionStorage.removeItem(
                    "firebase_redirect_login"
                );


                await CheckLoginResult();

                return;
            }


            // ========================================================
            // CASE 2
            // 최초 페이지 진입
            // ========================================================

            await StartGoogleLogin();
        }


        // ============================================================
        // Start
        // ============================================================

        Main();

    </script>

</body>

</html>
